spring.application.name=AiAgentDemo

# ── LLM API (OpenAI-compatible, reads from .env or environment variables) ──
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://token-plan-sgp.xiaomimimo.com}
spring.ai.openai.api-key=${OPENAI_API_KEY:tp-sn2euhottgpworkmxelccyyote0zxjf1efmf16kyioe25zgy}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:mimo-v2.5-pro}
spring.ai.openai.chat.options.max-tokens=8192
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:Qwen3-VL-Embedding-8B}
# ── HTTP client timeouts (prevent LLM calls from hanging indefinitely) ──
spring.http.client.connect-timeout=10000
spring.http.client.read-timeout=120000
# NOTE: Spring AI OpenAI module uses its own RestClient internally.
# If the above properties don't take effect, configure timeout via
# a RestClientCustomizer bean in a @Configuration class.

# ── Rerank ──
rag.enabled=${RAG_ENABLED:true}
rag.rerank.path=/rerank
rag.rerank.model=rerank

# ── MCP Server ──
spring.ai.mcp.server.name=AiAgentDemo-MCP-Server
spring.ai.mcp.server.version=1.0.0

# ── H2 file database ──
# ── Multipart upload limits ──
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
testing-platform.attachments.dir=${user.dir}/data/attachments

spring.datasource.url=jdbc:h2:file:./data/treeify;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# ── Flyway ──
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── Logging (set to DEBUG to see LLM request/response details) ──
logging.level.io.modelcontextprotocol.client.LifecycleInitializer=ERROR
logging.level.com.zoujuexian.aiagentdemo.service.treeify=INFO

# ── Embedding API (separate from chat API, for vector embeddings) ──
embedding.api.base-url=${EMBEDDING_BASE_URL:https://ai.gitee.com}
embedding.api.key=${EMBEDDING_API_KEY:1PY1A7VQVGRUCJZNQTRIQIW8TDMIYJSTOJONIM1G}
embedding.api.model=${EMBEDDING_MODEL:Qwen3-Embedding-8B}
# Disable auto-configured embedding model (uses chat API base URL)
spring.ai.model.embedding=none

# ── pgvector (second datasource for vector storage, optional) ──
spring.datasource.vectors.url=${SPRING_DATASOURCE_VECTORS_URL:}
spring.datasource.vectors.username=${SPRING_DATASOURCE_VECTORS_USERNAME:treeify}
spring.datasource.vectors.password=${SPRING_DATASOURCE_VECTORS_PASSWORD:treeify123}
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1024
