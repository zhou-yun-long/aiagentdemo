# Test configuration: in-memory H2 with auto schema update, disable LLM
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false

# Skip Flyway in tests (entity-driven ddl-auto=update is sufficient)
spring.flyway.enabled=false

# Disable LLM (not needed for controller IT)
spring.ai.openai.api-key=test
spring.ai.openai.base-url=http://localhost:1

# Disable MCP server in tests
spring.ai.mcp.server.enabled=false

# Attachment dir for tests
testing-platform.attachments.dir=target/test-attachments

# Disable RAG in tests
rag.enabled=false

# Allow test beans to override production beans
spring.main.allow-bean-definition-overriding=true

# Suppress noisy logs
logging.level.io.modelcontextprotocol=ERROR
logging.level.com.zoujuexian.aiagentdemo.service.treeify=INFO
